<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация — MovieSnack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="header" id="siteHeader"></header>
    <main class="panel auth">
      <h1>Регистрация</h1>
      <form class="form" id="authForm" data-mode="register" novalidate>
      <label class="field">Email
        <input name="email" type="email" autocomplete="email">
        <span class="field__error" data-error="email"></span>
      </label>
      <label class="field">Пароль
        <input name="password" type="password" autocomplete="new-password">
        <span class="field__error" data-error="password"></span>
      </label>
      <label class="field">Повторите пароль
        <input name="password2" type="password" autocomplete="new-password">
        <span class="field__error" data-error="password2"></span>
      </label>
      <p class="field__error" id="formError"></p>
        <button class="btn" type="submit">Создать аккаунт</button>
      </form>
      <p class="hint">Уже есть аккаунт? <a href="login.html">Войти</a></p>
      <p class="hint">Демо (моки): admin@mail.ru / admin123, user@mail.ru / user123</p>
    </main>
    <footer class="footer"><p>MovieSnack · СДП-ПИ-241</p></footer>
  </div>
  <script src="js/mock.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/login.js"></script>
</body>
</html>
